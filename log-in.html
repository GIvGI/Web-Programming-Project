    <main class="signing" id="login">
    <form>
        <fieldset>
            <legend>Log In</legend>
            <h2>Log In</h2>

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Email"
                required
            />

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Password"
                required
            />


            <input 
                class = "submit"
                type="submit"
                id="submit"
                name="login"
                value="Login"
            />

        </fieldset>
    </form>

    </main>
