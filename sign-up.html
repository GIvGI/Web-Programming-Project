<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chemin de grammaire</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <header>
            <a href="index.html" class="logo">
                <img class="logo-photo" src="images/france-flag.png" alt="Logo Name">
                <h1>chemin de<br>grammaire</h1>
            </a>
        <nav>
            <ul>
                <li><a href="log-in.html">Login</a></li>
                <li><a href="sign-up.html">Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <main class="signing" id="sign-up">
    <form>
        <fieldset>
            <legend>Sign Up</legend>
            <h2>Sign Up</h2>
            <label for="fullName">Full Name</label>
            <input
                type="text"
                id="fullName"
                name="fullName"
                placeholder="Full Name"
                required
            />

            <label for="birthday">Birthday</label>
            <input
                type="date"
                id="birthday"
                name="birthday"
                required
            />


            <label for="gender">Gender</label>
            <select id="gender" name="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Email"
                required
            />

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Password"
                required
            />


            <input 
                class = "submit"
                type="submit"
                id="submit"
                name="submit"
                value="Submit"
            />

        </fieldset>
    </form>

    </main>



    <footer>
      <ul>
        <li><a href="tel:+9955555555">Phone: 555 55 55 55</a></li>
        <li><a href="mailto:chemindegrammaire@gmail.com">Email: chemindegrammaire@gmail.com</a></li>
      </ul>
      <a href="about.html">About</a>
    </footer>
</body>
</html>
