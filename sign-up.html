<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <header>
        <h1><a href="index.html">FroadMap</a></h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html">Login</a></li>
                <li><a href="index.html">Sign Up</a></li>
                <li><a href="index.html">About</a></li>
            </ul>
        </nav>
    </header>

    <main id="signing" class="sign-up">
    <form>
        <fieldset>
            <legend>Sign Up</legend>
            <h2>Sign Up</h2>
            <label for="fullName">Full Name</label>
            <input
                type="text"
                id="fullName"
                name="fullName"
                placeholder="Full Name"
                required
            />

            <label for="birthday">Birthday</label>
            <input
                type="date"
                id="birthday"
                name="birthday"
                required
            />


            <label for="gender">Gender</label>
            <select id="gender" name="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Email"
                required
            />

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Password"
                required
            />


            <input 
                class = "submit"
                type="submit"
                id="submit"
                name="submit"
                value="Submit"
            />

        </fieldset>
    </form>

    </main>



    <footer id="footer">
      <ul>
        <li><a href="tel:000000000">000000000</a></li>
        <li><a href="mailto:test@test.com">tet@test.com</a></li>
      </ul>
    </footer>
</body>
</html>
